<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Discussions Années 80</title>
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(45deg, #ff00ff, #00ffff, #ffcc00);
            background-size: 400% 400%;
            animation: gradientAnimation 10s infinite alternate;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #fff;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #ff00ff;
            font-size: 1.5em;
            text-shadow: 2px 2px 5px #00ffff;
        }

        .table-container {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .table-container::-webkit-scrollbar {
            width: 8px;
        }

        .table-container::-webkit-scrollbar-thumb {
            background-color: #ff00ff;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
            background-color: black;
            color: #00ffff;
            border: 2px solid #ff00ff;
        }

        th, td {
            border: 1px solid #ff00ff;
            padding: 15px;
            text-align: left;
            font-size: 1em;
        }

        th {
            background-color: #ff00ff;
            color: black;
            text-shadow: 1px 1px 3px #00ffff;
        }

        tr:nth-child(even) {
            background-color: rgba(255, 0, 255, 0.2);
        }

        tr:hover {
            background-color: rgba(0, 255, 255, 0.5);
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            color: black;
            background-color: #ff00ff;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 0 10px #ff00ff;
            transition: transform 0.2s;
        }

        a:hover {
            background-color: #00ffff;
            box-shadow: 0 0 10px #00ffff;
            transform: scale(1.1);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Historiques Rétro</h1>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nom d'utilisateur</th>
                        <th>Message</th>
                        <th>Citation</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="discussion : ${discussions}">
                        <td th:text="${discussion.username}"></td>
                        <td th:text="${discussion.message}"></td>
                        <td th:text="${discussion.quote}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <a href="/chat">Retour au chat</a>
    </div>
</body>
</html>
